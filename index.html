<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Festival Season MVP 0.12</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eee7da;color:#151412;font-family:Arial,Helvetica,sans-serif}main{text-align:center;padding:32px}strong{display:block;font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;font-size:42px;margin-bottom:8px}.small{color:#746d63}</style></head><body><main><strong>Festival Season</strong><div class="small">Loading the latest playtest...</div></main><script>(async()=>{try{const files=Array.from({length:3},(_,i)=>`v012/data${String(i+1).padStart(2,'0')}.txt`);const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(`Could not load ${f}`);return r.text()}));const b64=parts.join('').replace(/\s+/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Browser does not support gzip decompression');const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<main><strong>Festival Season</strong><div class="small">The playtest could not load. Refresh the page and try again.</div></main>'}})();</script></body></html>
