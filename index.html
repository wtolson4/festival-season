<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Festival Season MVP 0.15</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eee7da;color:#151412;font-family:Arial,Helvetica,sans-serif}main{text-align:center;padding:32px}strong{display:block;font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;font-size:42px;margin-bottom:8px}.small{color:#746d63}</style></head><body><main><strong>Festival Season</strong><div class="small">Loading v0.15...</div></main><script>(async()=>{try{const files=Array.from({length:6},(_,i)=>`v015/data${String(i+1).padStart(2,'0')}.txt`);const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error('Could not load '+f);return r.text()}));const b64=parts.join('').replace(/\s+/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw Error('Browser does not support gzip decompression');const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const parsed=new DOMParser().parseFromString(html,'text/html');const scripts=[...parsed.querySelectorAll('script')].map(s=>({src:s.getAttribute('src'),code:s.textContent,async:s.hasAttribute('async'),head:s.parentElement===parsed.head}));parsed.querySelectorAll('script').forEach(s=>s.remove());document.head.innerHTML=parsed.head.innerHTML;document.body.innerHTML=parsed.body.innerHTML;for(const s of scripts){const e=document.createElement('script');if(s.src){e.src=s.src;e.async=s.async}else e.textContent=s.code;(s.head?document.head:document.body).appendChild(e)}}catch(e){console.error(e);document.body.innerHTML='<main><strong>Festival Season</strong><div class="small">The playtest could not load. Refresh the page and try again.</div></main>'}})();</script></body></html>
