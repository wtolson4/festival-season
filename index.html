<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Festival Season MVP 0.14</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eee7da;color:#151412;font-family:Arial,Helvetica,sans-serif}main{text-align:center;padding:32px}strong{display:block;font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;font-size:42px;margin-bottom:8px}.small{color:#746d63}</style></head><body><main><strong>Festival Season</strong><div class="small">Loading the latest playtest...</div></main><script>(async()=>{try{async function gz(s){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}async function grab(files){return (await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error('Could not load '+f);return r.text()}))).join('').replace(/\s+/g,'')}const baseFiles=Array.from({length:3},(_,i)=>`v013/data${String(i+1).padStart(2,'0')}.txt`);const patchFiles=['v014patch/p01.txt','v014patch/p02.txt','v014patch/p03.txt','v014patch/p04.txt','v014patch/p05.txt','v014patch/p06a.txt','v014patch/p06b.txt','v014patch/p06c.txt','v014patch/p06d.txt','v014patch/p07.txt','v014patch/p08.txt'];let html=await gz(await grab(baseFiles));const edits=JSON.parse(await gz(await grab(patchFiles)));for(let i=edits.length-1;i>=0;i--){const [a,b,t]=edits[i];html=html.slice(0,a)+t+html.slice(b)}document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<main><strong>Festival Season</strong><div class="small">The playtest could not load. Refresh the page and try again.</div></main>'}})();</script></body></html>
